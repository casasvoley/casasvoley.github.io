media:
  input: media
  output: /media
content:
  - name: profile
    label: Perfil del sitio
    type: file
    path: content/profile.json
    format: json
    fields:
      - name: name
        label: Nombre
        type: string
      - name: role
        label: Titular profesional
        type: string
      - name: metaDescription
        label: Descripción para buscadores
        type: text
      - name: heroEyebrow
        label: Especialidades de portada
        type: string
      - name: heroLine1
        label: Primera línea del titular
        type: string
      - name: heroLine2
        label: Segunda línea del titular
        type: string
      - name: heroAccent
        label: Línea destacada del titular
        type: string
      - name: heroDescription
        label: Resumen de portada
        type: text
      - name: heroImageUrl
        label: URL de imagen de portada
        type: string
      - name: heroImageFile
        label: Imagen de portada subida al repositorio
        type: image
        options:
          path: media
          extensions: [jpg, jpeg, png, webp, avif]
      - name: heroImageAlt
        label: Texto alternativo de portada
        type: string
      - name: aboutLine1
        label: Primera línea del título personal
        type: string
      - name: aboutAccent
        label: Línea destacada del título personal
        type: string
      - name: aboutFirstParagraph
        label: Biografía, párrafo 1
        type: text
      - name: aboutSecondParagraph
        label: Biografía, párrafo 2
        type: text
      - name: interests
        label: Intereses
        type: string
        list: true
      - name: contactHeadline
        label: Titular de contacto
        type: string
      - name: contactAccent
        label: Línea destacada del contacto
        type: string
      - name: contactDescription
        label: Texto de contacto
        type: text
      - name: email
        label: Correo electrónico
        type: string
      - name: githubUrl
        label: Perfil de GitHub
        type: string
      - name: linkedinUrl
        label: Perfil de LinkedIn
        type: string
  - name: projects
    label: Proyectos
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Nombre del proyecto
        type: string
      - name: category
        label: Categoría del filtro
        type: select
        options:
          values:
            - name: quantum
              label: Computación cuántica
            - name: software
              label: Desarrollo de software
            - name: research
              label: Investigación
      - name: tag
        label: Etiqueta visible
        type: string
      - name: meta
        label: Fecha o tipo
        type: string
      - name: description
        label: Descripción
        type: text
      - name: imageUrl
        label: URL de imagen
        type: string
      - name: imageFile
        label: Imagen subida al repositorio
        type: image
        options:
          path: media
          extensions: [jpg, jpeg, png, webp, avif]
      - name: imageAlt
        label: Texto alternativo de la imagen
        type: string
      - name: url
        label: Enlace al proyecto o publicación
        type: string
  - name: experience
    label: Experiencia y doctorado
    type: file
    path: content/experience.json
    format: json
    list: true
    fields:
      - name: date
        label: Periodo
        type: string
      - name: title
        label: Puesto o programa
        type: string
      - name: organization
        label: Universidad, empresa o equipo
        type: string
      - name: description
        label: Descripción y logros
        type: text
  - name: education
    label: Formación
    type: file
    path: content/education.json
    format: json
    list: true
    fields:
      - name: date
        label: Periodo
        type: string
      - name: title
        label: Titulación
        type: string
      - name: organization
        label: Universidad
        type: string
      - name: description
        label: Área o especialización
        type: text
